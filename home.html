<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Au Gres</title>
		<link rel="stylesheet" href="styles.css" />
	</head>

	<body>
		<nav class="navbar">
			<img
				id="logo-square-img"
				src="resources/images/Logo-Square.webp"
				alt="City of AuGres logo showing the four seasons as icons with text at the bottom saying Celebrate Our Seasons."
			/>
			<ul class="navbar-links center-vertically">
				<li>Things to Do</li>
				<li>Events</li>
				<li>Food & Drink</li>
			</ul>

			<div id="weather-container" class="center-vertically">
				<img
					id="weather-icon"
					src="resources/icons/Cloud.svg"
					alt="Outline of a cloud"
				/>
				<h2>67°</h2>
			</div>

			<div id="menu-container" class="center-vertically">
				<img
					src="resources/icons/Menu.svg"
					alt="Three horizontal lines indicating a menu."
				/>
			</div>
		</nav>

		<div id="hero-container">
			<div id="hero-text">
				<h2>Celebrate our seasons</h2>
			</div>
		</div>
		<div class="footer"></div>
	</body>
</html>
